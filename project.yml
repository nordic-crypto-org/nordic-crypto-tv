name: NordicCrypto
options:
  bundleIdPrefix: no.cryptonordic
  deploymentTarget:
    iOS: "18.0"
    tvOS: "18.0"
    macOS: "15.0"
    visionOS: "2.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "10"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: YQBXSUUVJD
targets:
  NordicCrypto:
    type: application
    supportedDestinations: [iOS, tvOS, macOS, visionOS]
    sources:
      - path: NordicCrypto
        excludes:
          - Resources/Snapshot
          - "*.entitlements"
          - "Info-iOS.plist"
      - path: NordicCrypto/Resources/Snapshot
        type: folder
        buildPhase: resources
    dependencies:
      # VideoPlayer lives in the _AVKit_SwiftUI overlay, whose player view subclasses
      # AVPlayerView/AVPlayerViewController. Nothing else references AVKit on iOS and macOS,
      # so the linker drops the autolinked framework and VideoPlayer aborts at runtime.
      - sdk: AVKit.framework
    settings:
      base:
        # One bundle id on every platform gives a single universal purchase.
        PRODUCT_BUNDLE_IDENTIFIER: no.cryptonordic.tv
        PRODUCT_NAME: Nordic Crypto
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nordic Crypto
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletvos*]": "App Icon & Top Shelf Image"
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletvsimulator*]": "App Icon & Top Shelf Image"
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=xros*]": AppIcon-Vision
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=xrsimulator*]": AppIcon-Vision
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": NordicCrypto/NordicCrypto-macOS.entitlements
        # Push notifications (aps-environment) on iPhone, iPad and Vision Pro; Apple TV has none.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": NordicCrypto/NordicCrypto-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": NordicCrypto/NordicCrypto-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=xros*]": NordicCrypto/NordicCrypto-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=xrsimulator*]": NordicCrypto/NordicCrypto-iOS.entitlements
        "INFOPLIST_FILE[sdk=iphoneos*]": NordicCrypto/Info-iOS.plist
        "INFOPLIST_FILE[sdk=iphonesimulator*]": NordicCrypto/Info-iOS.plist
        ENABLE_HARDENED_RUNTIME: YES
        SUPPORTS_MACCATALYST: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  NordicCryptoTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, tvOS]
    sources:
      - NordicCryptoTests
    dependencies:
      - target: NordicCrypto
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Nordic Crypto.app/Nordic Crypto"
  NordicCryptoTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - NordicCryptoTVUITests
    dependencies:
      - target: NordicCrypto
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NordicCrypto
  NordicCryptoScreenshotTests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, tvOS, macOS, visionOS]
    sources:
      - NordicCryptoScreenshotTests
    dependencies:
      - target: NordicCrypto
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NordicCrypto
schemes:
  NordicCrypto:
    build:
      targets:
        NordicCrypto: all
        NordicCryptoTests: [test]
        NordicCryptoTVUITests: [test]
    test:
      targets:
        - NordicCryptoTests
        - NordicCryptoTVUITests
  NordicCryptoScreenshots:
    build:
      targets:
        NordicCrypto: all
        NordicCryptoScreenshotTests: [test]
    test:
      targets:
        - NordicCryptoScreenshotTests
