# Build check for pull requests and main, for every Apple platform of the one
# multiplatform target: unsigned Release build for the device (what TestFlight
# gets), unit tests in the simulator where the test target supports it (iOS,
# tvOS), and a parse of the fastlane lanes. No secrets are used here, so it is
# safe for pull requests from forks. Deploying is .github/workflows/testflight.yml.

name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # TestFlight runs these tests before it builds for upload.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  FASTLANE_HIDE_CHANGELOG: "1"
  FASTLANE_OPT_OUT_USAGE: "1"
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  apple:
    name: ${{ matrix.platform }} build and tests
    # Same image and Xcode as the TestFlight upload.
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            device: generic/platform=iOS
            simulator: iOS
          - platform: tvos
            device: generic/platform=tvOS
            simulator: tvOS
            ui: NordicCryptoTVUITests
          - platform: visionos
            device: generic/platform=visionOS
          - platform: macos
            device: generic/platform=macOS
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        id: toolchain
        run: |
          sw_vers; xcodebuild -version; ruby -v; bundle -v
          echo "ruby=$(ruby -e 'print RUBY_VERSION')" >> "$GITHUB_OUTPUT"
      - name: Generate the Xcode project
        run: scripts/xcodegen.sh
      - name: Pick a simulator
        id: sim
        if: matrix.simulator
        env:
          SIM_OS: ${{ matrix.simulator }}
        run: |
          id=$(xcrun simctl list devices available --json | python3 -I -c '
          import json, os, sys
          os_name = os.environ["SIM_OS"]
          prefer = {"iOS": "iPhone", "tvOS": "Apple TV 4K"}[os_name]
          devices = json.load(sys.stdin)["devices"]
          found = [d for runtime, ds in sorted(devices.items(), reverse=True) if f"SimRuntime.{os_name}-" in runtime for d in ds]
          print(next((d["udid"] for d in found if d["name"].startswith(prefer)), found[0]["udid"] if found else ""))')
          [ -n "$id" ] || { echo "::error::No $SIM_OS simulator on this image"; xcrun simctl list devices available; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Tests (simulator, unsigned)
        if: matrix.simulator
        env:
          SIM_OS: ${{ matrix.simulator }}
          SIM_ID: ${{ steps.sim.outputs.id }}
          UI: ${{ matrix.ui }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project NordicCrypto.xcodeproj \
            -scheme NordicCrypto \
            -destination "platform=$SIM_OS Simulator,id=$SIM_ID" \
            -only-testing:NordicCryptoTests ${UI:+-only-testing:$UI} \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild-test.log | grep -E "error:|Test Suite|Executed|\*\* " || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build/xcodebuild-test.log
      - name: Screenshots from the UI tests
        if: always() && matrix.ui
        run: xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/screenshots || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.ui
        with:
          name: screenshots-${{ matrix.platform }}
          path: build/screenshots
          if-no-files-found: ignore
          retention-days: 14
      - name: Release build for the device (unsigned)
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project NordicCrypto.xcodeproj \
            -scheme NordicCrypto \
            -configuration Release \
            -destination "$DEVICE" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild-release.log | grep -E "error:|\*\* " || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build/xcodebuild-release.log
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.platform == 'tvos'
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ runner.arch }}-ruby${{ steps.toolchain.outputs.ruby }}-${{ hashFiles('Gemfile.lock') }}
      - name: fastlane lanes parse
        if: matrix.platform == 'tvos'
        run: |
          bundle config set --local path vendor/bundle
          bundle install --jobs 4 --retry 3
          bundle exec fastlane lanes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: xcodebuild-logs-${{ matrix.platform }}
          path: build/*.log
          if-no-files-found: ignore
          retention-days: 7
